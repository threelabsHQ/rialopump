name: Deploy App

# Builds the frontend and (optionally) deploys the full-stack app.
# The deploy job is intentionally left as a commented template — fill in the
# section that matches your hosting target (Fly.io, Railway, Render, etc.).

on:
  push:
    branches: [main]
    paths-ignore:
      - "contracts/**"
      - "foundry.toml"
      - "remappings.txt"
      - "AGENTS.md"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  # ── Build & validate ─────────────────────────────────────────────────────────
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + typecheck
        run: |
          bun run lint
          bun run typecheck

      - name: Build Vite frontend
        run: bunx vite build
        env:
          # Inject any VITE_* public env vars from GitHub Actions variables/secrets
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

