name: Deploy Frontend → Cloudflare Pages

# Triggers on every push to main (and on PRs for preview deployments)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write   # lets Wrangler post a GitHub Deployment status

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Bun setup ─────────────────────────────────────────────────────────
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── 3. Install deps ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── 4. Vite build ────────────────────────────────────────────────────────
      # VITE_* vars added here are baked into the JS bundle (publicly readable).
      # Add any public frontend config as repository variables, not secrets.
      - name: Build Vite frontend
        run: bun run build
        env:
          # Override the API base URL so the deployed frontend talks to your
          # production backend. Set this as a GitHub Actions variable:
          #   Repo → Settings → Secrets and variables → Actions → Variables → New
          #   Name: VITE_API_BASE   Value: https://your-backend.example.com
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_PROGRAM_ID: ${{ vars.VITE_PROGRAM_ID }}

      # ── 5. Deploy to Cloudflare Pages ────────────────────────────────────────
      # On push to main  → production deployment
      # On pull_request  → preview deployment (unique URL per PR)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'rialopump' }}
            --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
