name: Deploy Program to Rialo Devnet

on:
  push:
    branches: [main]
    paths:
      - "program/**"
      - "scripts/deploy-program.ts"
      - ".github/workflows/deploy-contracts.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force deploy even without program changes"
        type: boolean
        default: false

concurrency:
  group: deploy-program
  cancel-in-progress: false  # never interrupt a live deploy

jobs:
  build-and-deploy:
    name: Build PolkaVM + Deploy to Rialo Devnet
    runs-on: ubuntu-latest
    environment: devnet
    permissions:
      contents: write  # needed to commit updated AGENTS.md back to the repo

    steps:
      - uses: actions/checkout@v4

      # ── Install rialoman + rialo toolchain ──────────────────────────────────
      - name: Install rialoman
        run: |
          curl -fsSL https://rialo-artifacts.s3.us-east-2.amazonaws.com/rialoman/stable/install.sh | bash
          echo "$HOME/.local/share/rialo/bin" >> "$GITHUB_PATH"

      - name: Install Rialo stable release + Rust toolchain
        run: |
          rialoman install stable@latest
          rialoman use stable@latest

      # ── Cache ───────────────────────────────────────────────────────────────
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            program/target
          key: rialo-polkavm-${{ runner.os }}-${{ hashFiles('program/Cargo.lock') }}
          restore-keys: rialo-polkavm-${{ runner.os }}-

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build .polkavm binary
        working-directory: program
        run: cargo +rialo build --release

      - name: Locate .polkavm artifact
        id: artifact
        run: |
          path=$(find program/target -name "hugefun_program.polkavm" | head -1)
          if [ -z "$path" ]; then
            path=$(find program/target -name "*.polkavm" | head -1)
          fi
          if [ -z "$path" ]; then
            echo "ERROR: no .polkavm file found" && exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Found: $path ($(du -sh $path | cut -f1))"

      # ── JS deps for deploy script ───────────────────────────────────────────
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # ── Deploy ──────────────────────────────────────────────────────────────
      - name: Deploy program to Rialo devnet
        env:
          RIALO_DEVNET_RPC: ${{ vars.RIALO_DEVNET_RPC || 'https://devnet.rialo.io:4101' }}
          DEPLOYER_SECRET_HEX: ${{ secrets.DEPLOYER_SECRET_HEX }}
          PROGRAM_KEYPAIR_HEX: ${{ secrets.PROGRAM_KEYPAIR_HEX }}
          POLKAVM_PATH: ${{ steps.artifact.outputs.path }}
        run: bun run scripts/deploy-program.ts

      # ── Commit deployed address back to repo ────────────────────────────────
      - name: Commit updated AGENTS.md
        uses: EndBug/add-and-commit@v9
        with:
          add: AGENTS.md
          message: "chore: update deployed program ID [skip ci]"
          default_author: github_actions
          push: true
